# Stage/prod host stack: prebuilt backend image behind Nginx. Local development uses docker-compose.yml.
# Required env: BACKEND_IMAGE (ECR URI + tag), APP_ENV (stage|prod), AWS_REGION.
# Secrets are read from Parameter Store by the app itself, so no .env file is used.
services:
  backend:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE to the ECR image URI and tag}
    environment:
      APP_ENV: ${APP_ENV:?set APP_ENV to stage or prod}
      AWS_REGION: ${AWS_REGION:?set AWS_REGION}
    # No "ports": the backend is reachable only from Nginx on the compose network.
    expose:
      - "80"
    healthcheck:
      # The slim image has no curl; urlopen raises on non-2xx so a failing /health exits non-zero.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
